---
- name: Installing bind9 and dns tools
  apt:
    pkg:
      - bind9 
      - dnsutils
    update_cache: yes

- name: Setting up config file
  template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    mode: '0644'
    group: bind

- name: Setting up config options file
  copy:
    src: named.conf.options
    dest: /etc/bind
    mode: '0644'
    group: bind

- name: Add user for bind_exporter 
  user:
    name: "bind_exporter"
    state: present
    shell: /usr/sbin/nologin
    create_home: no 

- name: Downloading bind9 exporter binary
  get_url:
    url:  https://github.com/prometheus-community/bind_exporter/releases/download/v{{ bind9_exporter_version }}/bind_exporter-{{ bind9_exporter_version }}.linux-amd64.tar.gz
    dest: /tmp

- name: Extracting and setting up binaries 
  unarchive:
    src: /tmp/bind_exporter-{{ bind9_exporter_version }}.linux-amd64.tar.gz
    dest:  /tmp
    remote_src: yes

- name: Copy bind_exporter to /usr/local/bin
  copy: 
    src: /tmp/bind_exporter-{{ bind9_exporter_version }}.linux-amd64/bind_exporter
    dest: /usr/local/bin
    mode: '0744'
    owner: bind_exporter 
    group: bind_exporter
    remote_src: yes

- name: Setting up systemd file
  copy:
    src: bind_exporter.service
    dest: /etc/systemd/system
    mode: '0644'
    owner: root
    group: root

- name: Reload systemd daemon
  systemd_service:
    daemon_reload: true

- name: Enable service and starting bind_exporter
  systemd_service:
    name: bind_exporter
    state: started
    enabled: true